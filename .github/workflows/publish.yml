name: publish

# Publishes to pub.dev when a release tag is pushed, using pub.dev's
# automated publishing (OIDC): no stored token.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*', 'wherefrom_builder-v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

jobs:
  wherefrom:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/wherefrom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub publish --force

  wherefrom_builder:
    if: startsWith(github.ref_name, 'wherefrom_builder-v')
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/wherefrom_builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: dart pub publish --force
